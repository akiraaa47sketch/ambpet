{% macro campo(nome, rotulo, dados, erros, tipo='text', obrigatorio=true, extra='', ajuda='') %}
<label class="campo {{ 'com-erro' if erros.get(nome) }}">
  <span>{{ rotulo }}{% if obrigatorio %} <b class="obr">*</b>{% endif %}</span>
  <input type="{{ tipo }}" name="{{ nome }}" value="{{ dados.get(nome) if dados.get(nome) is not none else '' }}" {{ 'required' if obrigatorio }} {{ extra|safe }}>
  {% if ajuda %}<small class="ajuda">{{ ajuda }}</small>{% endif %}
  {% if erros.get(nome) %}<small class="erro">{{ erros[nome] }}</small>{% endif %}
</label>
{% endmacro %}

{% macro csrf() %}<input type="hidden" name="_csrf" value="{{ csrf_token() }}">{% endmacro %}

{% macro status_badge(ag) %}<span class="badge st-{{ ag.status }}">{{ ag.status_nome }}</span>{% endmacro %}
