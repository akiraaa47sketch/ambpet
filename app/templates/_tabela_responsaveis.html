{% if itens %}
<div class="tabela-rolagem">
<table class="tabela">
  <thead><tr><th>Responsável</th><th>CPF</th><th>Telefone</th><th>Animais</th><th></th></tr></thead>
  <tbody>
  {% for r in itens %}
    <tr>
      <td><a href="{{ url_for('responsaveis.ver', rid=r.id) }}"><b>{{ r.nome }}</b></a></td>
      <td class="nowrap">{{ r.cpf|cpf }}</td>
      <td class="nowrap">{{ r.telefone|telefone }}</td>
      <td>
        {% for a in r.animais %}<a class="chip" href="{{ url_for('animais.ver', aid=a.id) }}">{{ a.nome }} <small>{{ a.especie }}</small></a>{% else %}<span class="sutil">nenhum</span>{% endfor %}
      </td>
      <td class="acoes">
        {% if acao_agendar %}<a class="btn btn-primario btn-peq" href="{{ url_for('agenda.novo', responsavel_id=r.id) }}">Selecionar</a>
        {% else %}<a class="btn btn-peq" href="{{ url_for('responsaveis.ver', rid=r.id) }}">Abrir</a>{% endif %}
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% endif %}
