{% extends "base.html" %}
{% block titulo %}Alterar senha{% endblock %}
{% block conteudo %}
<h1>Alterar minha senha</h1>
<form method="post" class="cartao estreito">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label class="campo"><span>Senha atual</span><input type="password" name="atual" required autocomplete="current-password"></label>
  <label class="campo"><span>Nova senha (mín. 8 caracteres)</span><input type="password" name="nova" minlength="8" required autocomplete="new-password"></label>
  <label class="campo"><span>Confirmar nova senha</span><input type="password" name="confirmacao" minlength="8" required autocomplete="new-password"></label>
  <button class="btn btn-primario">Salvar</button>
</form>
{% endblock %}
