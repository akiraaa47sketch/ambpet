{% extends "base.html" %}
{% block titulo %}Verificação{% endblock %}
{% block simples %}
<div class="painel-acesso">
  <div class="acesso-marca">{{ icone('cadeado') }}<span>Verificação em duas etapas</span></div>
  <h1>Digite o código</h1>
  <p class="sutil">Abra o aplicativo autenticador (Google Authenticator, Microsoft Authenticator, Authy) e informe o código de 6 dígitos.</p>
  <form method="post" class="form-acesso">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="campo"><label for="codigo">Código</label>
      <input id="codigo" name="codigo" class="codigo-otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required autofocus></div>
    <button class="btn btn-primario btn-bloco">Verificar</button>
  </form>
  <p class="rodape-acesso"><a href="{{ url_for('auth.login') }}">Voltar</a></p>
</div>
{% endblock %}
