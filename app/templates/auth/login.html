{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="login-caixa">
  <h1>🐾 {{ config.CLINICA_NOME }}</h1>
  <p class="sutil">Acesso restrito — Recepção e Veterinária</p>
  <form method="post" class="cartao">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label class="campo"><span>Usuário</span><input name="login" autocomplete="username" required autofocus></label>
    <label class="campo"><span>Senha</span><input name="senha" type="password" autocomplete="current-password" required></label>
    <button class="btn btn-primario largo">Entrar</button>
  </form>
</div>
{% endblock %}
