{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block simples %}
<div class="painel-acesso">
  <div class="acesso-marca">{{ icone('pata') }}<span>{{ config.CLINICA_NOME }}</span></div>
  <h1>Entrar</h1>
  <p class="sutil">Acesso restrito à equipe da clínica.</p>
  <form method="post" class="form-acesso">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="campo"><label for="login">Usuário</label><input id="login" name="login" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></div>
    <div class="campo"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-primario btn-bloco">Entrar</button>
  </form>
  <p class="rodape-acesso"><a href="{{ url_for('lgpd.aviso') }}">Aviso de privacidade</a></p>
</div>
{% endblock %}
